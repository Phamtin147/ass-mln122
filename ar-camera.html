<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cyber-Marx: AR Camera Mode</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00f0ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --neon-cyan: #00f0ff;
      --neon-pink: #ff007f;
      --neon-green: #00ff66;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; background:#000; font-family:sans-serif; color:#fff; }

    #hud {
      position:fixed; inset:0; pointer-events:none; z-index:100;
      display:flex; flex-direction:column; justify-content:space-between; padding:16px;
    }
    .top-bar { display:flex; justify-content:space-between; align-items:center; pointer-events:auto; }
    .back-btn {
      background:rgba(10,10,20,0.85); border:1px solid var(--neon-cyan); color:#fff;
      padding:8px 16px; border-radius:20px; font-weight:bold; cursor:pointer; font-size:12px;
    }
    .badge {
      background:rgba(10,10,20,0.85); border:1px solid var(--neon-cyan);
      padding:8px 14px; border-radius:8px; font-size:12px; font-weight:bold;
    }
    #start-overlay {
      position:fixed; inset:0; background:rgba(5,5,10,0.92); z-index:9999;
      display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:20px;
    }
    .start-btn {
      margin-top:20px; padding:14px 30px; font-size:16px; font-weight:bold;
      background:var(--neon-pink); color:#fff; border:none; border-radius:30px; cursor:pointer;
      box-shadow:0 0 20px var(--neon-pink);
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <h2 style="color:var(--neon-cyan); margin-bottom:8px;">CYBER-MARX AR CAMERA</h2>
    <p style="color:#aaa; font-size:14px;">Hướng camera vào tranh Cyber-Marx (trang bìa) để hiện Hologram 3D</p>
    <button class="start-btn" onclick="startAR()">BẬT CAMERA QUÉT AR</button>
  </div>

  <div id="hud">
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.href='index.html'">◀ VỀ CUỐN TRUYỆN 3D</button>
      <div class="badge" id="statusBadge">🔴 ĐANG QUÉT BÌA TRUYỆN...</div>
    </div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiScanning: no;" 
    embedded
    color-space="sRGB" 
    vr-mode-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="targetMarx">
      <a-plane position="0 0 0.01" width="1.05" height="1.39" material="color: #00f0ff; opacity: 0.35; transparent: true; wireframe: true" animation="property: rotation; to: 0 0 360; loop: true; dur: 20000; easing: linear"></a-plane>
      <a-ring position="0 0 0.05" radius-inner="0.45" radius-outer="0.55" material="color: #ff007f; opacity: 0.6; transparent: true" animation="property: rotation; to: 0 0 -360; loop: true; dur: 8000; easing: linear"></a-ring>
      <a-entity position="0 0.5 0.15">
        <a-text value="W = c + v + m" align="center" color="#00ff66" width="3.5"></a-text>
      </a-entity>
      <a-entity position="0 0.32 0.12">
        <a-text value="GIA TRI THANG DU SO: m = 85%" align="center" color="#00f0ff" width="2.2"></a-text>
      </a-entity>
      <a-entity position="0 -0.45 0.12">
        <a-text value="[ OMNI-CORP OVERRIDE: ACTIVE ]" align="center" color="#ffe600" width="2.4"></a-text>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    function startAR() {
      document.getElementById('start-overlay').style.display = 'none';
      document.querySelector('a-scene').systems["mindar-image-system"].start();
    }
    window.addEventListener('DOMContentLoaded', () => {
      const target = document.querySelector('#targetMarx');
      const badge = document.getElementById('statusBadge');
      target.addEventListener('targetFound', () => {
        badge.textContent = '🟢 ĐÃ KHÓA: CYBER-MARX!';
        badge.style.borderColor = 'var(--neon-green)';
        badge.style.color = 'var(--neon-green)';
      });
      target.addEventListener('targetLost', () => {
        badge.textContent = '🔴 ĐANG QUÉT BÌA TRUYỆN...';
        badge.style.borderColor = 'var(--neon-cyan)';
        badge.style.color = '#fff';
      });
    });
  </script>
</body>
</html>
